<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — VoltGrid</title>
  <meta name="description" content="Create a VoltGrid account to manage your fleet, view charging analytics, and more." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/rtl.css" />
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1/src/index.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-bg"></div>

    <!-- Theme & RTL Controls -->
    <div class="auth-top-actions">
      <button class="btn-rtl" aria-label="Toggle text direction" title="Toggle RTL direction">
        <i class="ph ph-arrows-left-right"></i>
      </button>
      <button class="btn-theme" aria-label="Toggle color theme" title="Toggle theme">
        <i class="ph ph-moon"></i>
      </button>
    </div>

    <div class="auth-card reveal">
      <a href="index.html" class="auth-logo" aria-label="VoltGrid Home">
        <div class="nav-logo-icon" style="width:40px;height:40px;font-size:1.5rem"><i class="ph ph-lightning"></i></div>
        <span class="nav-logo-text" style="font-size:1.5rem">VoltGrid</span>
      </a>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the world's most advanced EV network</p>
      
      <form class="auth-form" action="index.html" novalidate>
        <div class="grid-2" style="gap:var(--space-2)">
          <div class="form-group">
            <label for="first-name" class="form-label">First Name <span class="required">*</span></label>
            <input type="text" id="first-name" class="form-input" placeholder="Lucas" required />
            <span class="form-error" role="alert"></span>
          </div>
          <div class="form-group">
            <label for="last-name" class="form-label">Last Name <span class="required">*</span></label>
            <input type="text" id="last-name" class="form-input" placeholder="Smith" required />
            <span class="form-error" role="alert"></span>
          </div>
        </div>
        
        <div class="form-group">
          <label for="email" class="form-label">Email Address <span class="required">*</span></label>
          <input type="email" id="email" class="form-input" placeholder="name@company.com" required />
          <span class="form-error" role="alert"></span>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required />
          <span class="form-error" role="alert"></span>
        </div>
        
        <div class="form-group" style="margin-block-start:-0.5rem">
          <label class="form-checkbox" style="font-size:var(--size-caption)">
            <input type="checkbox" required />
            <span>I agree to the <a href="#" style="color:var(--color-primary);text-decoration:none">Terms of Service</a> and <a href="#" style="color:var(--color-primary);text-decoration:none">Privacy Policy</a></span>
          </label>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width:100%;margin-block-start:var(--space-2)">
          Create Account
        </button>
      </form>
      
      <p style="text-align:center;margin-block-start:var(--space-4);font-size:var(--size-caption);color:var(--color-text-muted)">
        Already have an account? <a href="login.html" style="color:var(--color-primary);font-weight:600;text-decoration:none">Sign in</a>
      </p>
      
      <a href="index.html" style="display:block;text-align:center;margin-block-start:var(--space-3);color:var(--color-text-subtle);font-size:var(--size-caption);text-decoration:none">
        <i class="ph ph-arrow-left"></i> Back to Home
      </a>
    </div>
  </main>
  <script src="assets/js/main.js"></script>
</body>
</html>
